[package]
name = "refield-editions-e2021"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
refield = { path = "../../../refield" }

[lints.rust]
# Negative cases are switched on with `--cfg` by `../run.sh`.
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(d44)", "cfg(d45)", "cfg(d48)", "cfg(d51)", "cfg(d52)",
    "cfg(fields)", "cfg(misplaced)",
    "cfg(d49_unknown)", "cfg(d49_duplicate)", "cfg(d49_type)", "cfg(d49_attr)",
    "cfg(missing)", "cfg(mismatch)", "cfg(behind)", "cfg(primitive)",
    "cfg(deprecated_place)", "cfg(unused_closure)",
] }

