[workspace]
resolver = "2"
members = [
    "refield",
    "refield-macros",
    "refield/tests/fixtures/models",
    "refield/tests/fixtures/facade",
    "refield/tests/fixtures/facade-consumer",
]

[workspace.package]
repository = "https://github.com/ZnqbuZ/refield"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
keywords = ["struct", "projection", "spread", "macro", "derive"]
categories = ["rust-patterns", "development-tools::procedural-macro-helpers"]

[workspace.dependencies]
refield-macros = { version = "0.1.0", path = "refield-macros" }

[profile.dev]
panic = "unwind"
debug = 2

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
strip = true
